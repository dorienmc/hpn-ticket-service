name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reservations_enabled:
        description: Enable the public ticket reservation button
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  frontend:
    name: Deploy frontend to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Validate reservation configuration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reservations_enabled == 'true' }}
        env:
          CLOUDFLARE_WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
          RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}
        run: |
          test -n "$CLOUDFLARE_WORKER_URL" || { echo "CLOUDFLARE_WORKER_URL must be set before enabling reservations."; exit 1; }
          test -n "$RECAPTCHA_SITE_KEY" || { echo "RECAPTCHA_SITE_KEY must be set before enabling reservations."; exit 1; }

      - name: Build frontend
        working-directory: apps/frontend
        env:
          VITE_API_BASE_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
          VITE_RESERVATIONS_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.reservations_enabled || 'false' }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: npm run build -- --base ./

      - name: Upload frontend build
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/frontend/dist

      - name: Deploy frontend to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
