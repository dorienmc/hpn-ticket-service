services:
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    command: sh -c "npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8787
      VITE_MAX_TICKETS_PER_RESERVATION: 5
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173/hpn-ticket-service/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    volumes:
      - ./apps/worker:/app
      - /app/node_modules
      - wrangler-data:/app/.wrangler
    command: >-
      sh -c "npm run db:migrate:local &&
      npm run dev:cloudflare --
      --ip 0.0.0.0
      --port 8787
      --var FRONTEND_URL:http://localhost:5173/hpn-ticket-service
      --var EMAIL_DELIVERY:mailpit
      --var MAILPIT_API_URL:http://mailpit:8025
      --var LOCAL_ADMIN_AUTH:true
      --var ING_PAYMENT_LINK:https://www.ing.nl/payreq/m/?trxid=example-demo-link"
    environment:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8787/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  wrangler-data:
